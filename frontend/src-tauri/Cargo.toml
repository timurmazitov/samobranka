[package]
name = "samobranka"
version = "1.3.0"
description = "Samobranka - privacy-first AI meeting assistant (record, transcribe, summarize)"
authors = ["Sujith S"]
license = "MIT"
repository = "https://github.com/timurmazitov/samobranka"
edition = "2021"
rust-version = "1.77"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]


# No compile-time GPU features: the only transcription engine (transcribe.cpp)
# loads its native library at runtime and picks CPU/Vulkan per the saved
# compute mode, so plain `cargo build` is the only build (see
# docs/GPU_ACCELERATION.md for the runtime Vulkan model).

[build-dependencies]
tauri-build = { version = "2.3.0", features = [] }
reqwest = { version = "0.11", features = ["blocking", "multipart", "json", "stream"] }
zip = "2.2"           # ZIP extraction (Windows, macOS)
tar = "0.4"           # TAR extraction (Linux)
xz2 = "0.1"           # XZ decompression (Linux)


[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
once_cell = "1.17.1"
uuid = { version = "1.0", features = ["v4", "serde"] }

# Cross-platform audio capture
cpal = "0.15.3"

# Wav encoding - now using manual WAV creation instead of hound
# hound = "3.5"

# Cli ! shouldn't be required if using as lib
clap = { version = "4.3", features = ["derive"] }

# Dates
chrono = { version = "0.4.31", features = ["serde"] }

# Log
log = "0.4"
tauri-plugin-log = { version = "2.6.0", features = ["colored"] }
which = "6.0.1"

# Bytes
bytemuck = "1.16.1"

# EBU R128 loudness normalization (professional broadcast standard)
ebur128 = "0.1"

# Noise suppression - RNNoise-based neural network noise reduction
nnnoiseless = "0.5"

futures-util = "0.3"
silero_rs = { git = "https://github.com/emotechlab/silero-rs", rev = "26a6460", package = "silero" }

# Error handling (recording_manager, model_downloader). ONNX Runtime (`ort`)
# is no longer a direct dependency: it only remains as a transitive
# dependency of silero_rs, which runs the VAD model through it.
thiserror = "2.0.16"

# audio.cpp in-process FFI: loading libaudiocpp.so / audiocpp.dll at runtime
libloading = "0.8"

# SHA-256 validation of transcribe.cpp model artifacts (pinned HF digests)
sha2 = "0.10"

# Async
tokio = { version = "1.32.0", features = ["full", "tracing"] }
tokio-util = "0.7"  # Utilities for tokio including CancellationToken
async-trait = "0.1"  # Trait abstraction for async methods

reqwest = { version = "0.11", features = ["blocking", "multipart", "json", "stream"] }

# crossbeam
crossbeam = "0.8.4"
dashmap = "6.1.0"

# Directories
dirs = "5.0.1"

# Additional dependencies for notification system
url = "2.5.0"
open = { version = "5.3.3", features = ["shellexecute-on-windows"] }


# System monitoring for resource management
sysinfo = "0.32"

lazy_static = { version = "1.4.0" }
realfft = "3.4.0"
regex = "1.11.0"
ndarray = "0.16"
bytes = { version = "1.9.0", features = ["serde"] }

esaxx-rs = "0.1.10"
symphonia = { version = "0.5.4", features = ["aac", "isomp4", "mp3", "flac", "ogg", "vorbis", "pcm", "wav", "opt-simd"] }
rand = "0.8.5"
rayon = "1.10"
rubato = "0.15.0"
ringbuf = "0.4.8"
tempfile = "3.3.0"
whatlang = "0.16.4"

ffmpeg-sidecar = { git = "https://github.com/nathanbabcock/ffmpeg-sidecar", branch = "main" }

sqlx = { version = "0.8", features = [ "runtime-tokio", "sqlite", "chrono"] }

# Common Tauri configuration
tauri = { version = "2.6.2", features = [ "macos-private-api", "protocol-asset", "tray-icon"] }
# Bare OS-locale probe for the l10n first-run fallback (native-i18n spec D3).
# Not an i18n dialect crate, so spec D10 (no fluent/rust-i18n) is unaffected:
# tauri 2.11 exposes no Rust locale API and tauri-plugin-os's Rust half is not
# installed in this workspace, so there is no dependency-free probe available.
sys-locale = "0.3"
tauri-plugin-fs = "2.4.0"
tauri-plugin-dialog = "2.3.0"
tauri-plugin-store = "2.4.0"
tauri-plugin-notification = "2.3.1"
tauri-plugin-updater = "2.3.0"
tauri-plugin-process = "2.3.0"

# Desktop-only single instance guard
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "=2.3.7"

# macOS-specific dependencies (audio capture, screen/window helpers)
[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2.6.2", features = ["protocol-asset", "macos-private-api", "tray-icon"] }
once_cell = "1.17.1"
objc = "0.2.7"
anyhow = "1.0"
time = { version = "0.3", features = ["formatting"] }
reqwest = { version = "0.11", features = ["multipart", "json"] }
core-graphics = "0.23"
cidre = { git = "https://github.com/yury/cidre", rev = "a9587fa", features = ["av"] }
dasp = "0.11.0"
futures-channel = "0.3.31"

# Windows-specific dependencies
[target.'cfg(target_os = "windows")'.dependencies]
futures-channel = "0.3.31"

# Linux-specific dependencies
[target.'cfg(target_os = "linux")'.dependencies]
futures-channel = "0.3.31"

# Native PipeWire/PulseAudio client for system-audio capture (bypasses cpal's
# ALSA-only host on Linux, no ~/.asoundrc setup required)
libpulse-binding = "2.30.1"

[dev-dependencies]
# `test` enables `tauri::test::mock_app`, so tests can exercise the
# `AppHandle`-shaped operations (event emission included) without a window.
tauri = { version = "2.6.2", features = ["test"] }
tempfile = "3.3.0"
infer = "0.15"
criterion = { version = "0.5.1", features = ["async_tokio"] }
memory-stats = "1.0"
strsim = "0.10.0"
futures = "0.3.31"

[patch.crates-io]
cpal = { git = "https://github.com/RustAudio/cpal", rev = "51c3b43" }
esaxx-rs = { git = "https://github.com/thewh1teagle/esaxx-rs.git", branch = "feat/dynamic-msvc-link" }
